
    ========== HEADER ================= -->

    <header class="top-header">

        <div>
            <p class="small-title">WELCOME BACK</p>
            <h1>My Music <span>🌸</span></h1>
        </div>

        <button class="icon-btn" id="settingsBtn">
            ⚙
        </button>

    </header>


    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <span>⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search your music..."
        >

    </div>


    <!-- ================= QUICK ACTIONS ================= -->

    <section class="quick-actions">

        <button class="action-card" id="importBtn">
            <span class="action-icon">＋</span>
            <span>
                <strong>Import</strong>
                <small>Add music</small>
            </span>
        </button>

        <button class="action-card" id="playlistBtn">
            <span class="action-icon">♡</span>
            <span>
                <strong>Playlist</strong>
                <small>Your collections</small>
            </span>
        </button>

    </section>

    <input
        type="file"
        id="fileInput"
        accept="audio/*"
        multiple
        hidden
    >


    <!-- ================= RECENTLY ADDED ================= -->

    <section class="section">

        <div class="section-heading">

            <h2>Recently Added</h2>

            <button id="seeAllBtn">
                See all
            </button>

        </div>

        <div
            class="recent-list"
            id="recentList"
        ></div>

    </section>


    <!-- ================= ALL SONGS ================= -->

    <section class="section all-section">

        <div class="section-heading">

            <h2>All Songs</h2>

            <span
                class="song-count"
                id="songCount"
            >
                0 songs
            </span>

        </div>

        <div
            class="song-list"
            id="songList"
        ></div>

    </section>


    <!-- ================= MINI PLAYER ================= -->

    <div
        class="mini-player"
        id="miniPlayer"
    >

        <div class="mini-cover" id="miniCover">
            ♪
        </div>

        <div class="mini-info">

            <strong id="miniTitle">
                No song selected
            </strong>

            <span id="miniArtist">
                Choose a song
            </span>

        </div>

        <button
            class="mini-play"
            id="miniPlayBtn"
        >
            ▶
        </button>

    </div>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

        <button class="nav-item active" data-page="home">
            <span>⌂</span>
            <small>Home</small>
        </button>

        <button class="nav-item" data-page="songs">
            <span>♫</span>
            <small>Songs</small>
        </button>

        <button class="nav-item" data-page="favorites">
            <span>♡</span>
            <small>Favorites</small>
        </button>

        <button class="nav-item" data-page="playlists">
            <span>☷</span>
            <small>Playlists</small>
        </button>

    </nav>

</div>


<!-- ===================================================== -->
<!-- NOW PLAYING -->
<!-- ===================================================== -->

<div
    class="player-screen"
    id="playerScreen"
>

    <div class="player-top">

        <button
            class="back-btn"
            id="closePlayer"
        >
            ↓
        </button>

        <span>NOW PLAYING</span>

        <button
            class="icon-btn"
            id="moreBtn"
        >
            ⋮
        </button>

    </div>


    <div class="player-content">

        <div
            class="big-cover"
            id="bigCover"
        >
            ♪
        </div>

        <div class="player-song-info">

            <h1 id="playerTitle">
                No song selected
            </h1>

            <p id="playerArtist">
                Choose a song
            </p>

        </div>


        <!-- PROGRESS -->

        <div class="progress-area">

            <input
                type="range"
                id="progressBar"
                min="0"
                max="100"
                value="0"
            >

            <div class="time-row">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="main-controls">

            <button id="shuffleBtn">
                🔀
            </button>

            <button id="previousBtn">
                ⏮
            </button>

            <button
                class="skip-btn"
                id="back5Btn"
            >
                ↶<small>5</small>
            </button>

            <button
                class="play-main"
                id="playBtn"
            >
                ▶
            </button>

            <button
                class="skip-btn"
                id="forward5Btn"
            >
                <small>5</small>↷
            </button>

            <button id="nextBtn">
                ⏭
            </button>

            <button id="repeatBtn">
                🔁
            </button>

        </div>


        <div class="player-extra">

            <button id="favoriteBtn">
                ♡ Add to favorites
            </button>

            <button id="editBtn">
                ✎ Edit song
            </button>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- EDIT MODAL -->
<!-- ===================================================== -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>Edit Song</h2>

            <button id="closeEdit">
                ×
            </button>

        </div>

        <label>
            Song name
            <input
                type="text"
                id="editTitle"
            >
        </label>

        <label>
            Artist
            <input
                type="text"
                id="editArtist"
            >
        </label>

        <label>
            Cover image
            <input
                type="file"
                id="editCover"
                accept="image/*"
            >
        </label>

        <button
            class="save-btn"
            id="saveEdit"
        >
            Save Changes
        </button>

    </div>

</div>


<!-- ===================================================== -->
<!-- PLAYLIST MODAL -->
<!-- ===================================================== -->

<div
    class="modal"
    id="playlistModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>Create Playlist</h2>

            <button id="closePlaylist">
                ×
            </button>

        </div>

        <label>

            Playlist name

            <input
                type="text"
                id="playlistName"
                placeholder="My favorite songs"
            >

        </label>

        <button
            class="save-btn"
            id="createPlaylist"
        >
            Create Playlist
        </button>

    </div>

</div>


<!-- AUDIO ENGINE -->

<audio
    id="audioPlayer"
    preload="metadata"
></audio>


<script src="app.js"></script>

</body>
              </html>
